
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYZON - Language Selection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f5f9;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      text-align: center;
      padding: 22px;
      border-radius: 12px;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }

    select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
      box-sizing: border-box;
    }

    select {
      border: 1px solid #bbb;
    }

    button {
      background: #172554;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      font-weight: bold;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>RYZON</h1>
  <h2>Select Your Language</h2>
  <p>Choose your preferred language to continue</p>
</header>

<div class="card">
  <h2>Available Languages</h2>

  <select id="language">
    <option value="">-- Select Language --</option>
    <option value="as">অসমীয়া - Assamese</option>
    <option value="bn">বাংলা - Bengali</option>
    <option value="brx">बड़ो - Bodo</option>
    <option value="doi">डोगरी - Dogri</option>
    <option value="gu">ગુજરાતી - Gujarati</option>
    <option value="hi">हिन्दी - Hindi</option>
    <option value="kn">ಕನ್ನಡ - Kannada</option>
    <option value="ks">कॉशुर - Kashmiri</option>
    <option value="kok">कोंकणी - Konkani</option>
    <option value="mai">मैथिली - Maithili</option>
    <option value="ml">മലയാളം - Malayalam</option>
    <option value="mni">মেইতেইলোন্ - Manipuri</option>
    <option value="mr">मराठी - Marathi</option>
    <option value="ne">नेपाली - Nepali</option>
    <option value="or">ଓଡ଼ିଆ - Odia</option>
    <option value="pa">ਪੰਜਾਬੀ - Punjabi</option>
    <option value="sa">संस्कृतम् - Sanskrit</option>
    <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ - Santali</option>
    <option value="sd">سنڌي - Sindhi</option>
    <option value="ta">தமிழ் - Tamil</option>
    <option value="te">తెలుగు - Telugu</option>
    <option value="ur">اردو - Urdu</option>
    <option value="en">English</option>
  </select>

  <button onclick="continueApp()">Continue</button>
  <p id="message"></p>
</div>

<footer>
  RYZON © 2026
</footer>

<script>
function continueApp() {
  const language = document.getElementById("language").value;
  const message = document.getElementById("message");

  if (!language) {
    message.textContent = "Please select a language.";
    return;
  }

  localStorage.setItem("ryzonLanguage", language);
  localStorage.setItem("ryzonNextAction", "home");

  window.location.href = "home.html";
}
</script>

</body>
</html>
