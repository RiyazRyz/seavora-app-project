
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">
<title>RYZON - Language Selection</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f5f9;
  color: #222;
  min-height: 100vh;
}

header {
  background: #071a30;
  color: white;
  text-align: center;
  padding: 22px;
  border: 1px solid #245174;
  border-radius: 16px;
  box-shadow: 0 10px 28px #071a3040;
}

.ryzon-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  margin-bottom: 10px;
}

.ryzon-mark {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(145deg,#55dcff,#078bd0);
  color: #fff;
  font-size: 31px;
  font-weight: 900;
  box-shadow: 0 6px 18px #078bd044;
}

.ryzon-brand h1 {
  margin: 0;
  color: #fff;
  letter-spacing: 3px;
}

header h1 { letter-spacing: 3px; }

header h1 {
  letter-spacing: 4px;
  margin-top: 0;
}

header h2 {
  margin-bottom: 8px;
}

header p {
  color: #dbeafe;
  font-size: 14px;
}

.card {
  background: white;
  padding: 20px;
  margin: 20px auto;
  max-width: 480px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000015;
}

select, button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border-radius: 8px;
  font-size: 16px;
}

select {
  border: 1px solid #bbb;
  background: white;
}

button {
  background: #172554;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#message {
  font-weight: bold;
  text-align: center;
  margin-top: 15px;
}

footer {
  text-align: center;
  margin-top: 25px;
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="ryzon-brand">
    <span class="ryzon-mark" aria-label="RYZON logo">R</span>
    <h1>RYZON</h1>
  </div>
  <h2>Select Your Language</h2>
  <p>Choose your preferred language to continue</p>
</header>

<div class="card">

  <h2>Available Languages</h2>

  <select id="language">
    <option value="">-- Select Language --</option>
    <option value="as">অসমীয়া - Assamese</option>
    <option value="bn">বাংলা - Bengali</option>
    <option value="brx">बड़ो - Bodo</option>
    <option value="doi">डोगरी - Dogri</option>
    <option value="gu">ગુજરાતી - Gujarati</option>
    <option value="hi">हिन्दी - Hindi</option>
    <option value="kn">ಕನ್ನಡ - Kannada</option>
    <option value="ks">कॉशुर - Kashmiri</option>
    <option value="kok">कोंकणी - Konkani</option>
    <option value="mai">मैथिली - Maithili</option>
    <option value="ml">മലയാളം - Malayalam</option>
    <option value="mni">মেইতেইলোন্ - Manipuri</option>
    <option value="mr">मराठी - Marathi</option>
    <option value="ne">नेपाली - Nepali</option>
    <option value="or">ଓଡ଼ିଆ - Odia</option>
    <option value="pa">ਪੰਜਾਬੀ - Punjabi</option>
    <option value="sa">संस्कृतम् - Sanskrit</option>
    <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ - Santali</option>
    <option value="sd">سنڌي - Sindhi</option>
    <option value="ta">தமிழ் - Tamil</option>
    <option value="te">తెలుగు - Telugu</option>
    <option value="ur">اردو - Urdu</option>
    <option value="en">English</option>
  </select>

  <button id="continueButton" onclick="continueApp()">
    Continue
  </button>

  <p id="message"></p>

</div>

<footer>
  RYZON © 2026
</footer>

<script>
function continueApp() {
  const language = document.getElementById("language").value;
  const message = document.getElementById("message");
  const button = document.getElementById("continueButton");

  if (!language) {
    message.style.color = "red";
    message.textContent = "Please select a language.";
    return;
  }

  // Save the user's primary language
  localStorage.setItem("ryzonLanguage", language);

  // Clear any temporary language switch
  localStorage.removeItem("ryzonTemporaryEnglish");

  // Mark the next page as login
  localStorage.setItem("ryzonNextAction", "login");

  message.style.color = "green";
  message.textContent = "Language selected. Opening login page...";

  button.disabled = true;

  // Go to Login / Sign Up / OTP page
  setTimeout(function() {
    window.location.href = "otp.html";
  }, 400);
}
</script>

</body>
</html>
