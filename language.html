
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYZON - Language Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f5f9;
      color: #222;
    }
    header {
      background: #172554;
      color: white;
      text-align: center;
      padding: 22px;
      border-radius: 12px;
    }
    .card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }
    select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }
    select {
      border: 1px solid #bbb;
    }
    button {
      background: #172554;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message {
      font-weight: bold;
      text-align: center;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>RYZON</h1>
  <h2>Select Your Language</h2>
  <p>Choose your preferred language to continue</p>
</header>

<div class="card">
  <h2>Available Languages</h2>

  <select id="language">
    <option value="">-- Select Language --</option>
    <option value="Assamese">অসমীয়া - Assamese</option>
    <option value="Bengali">বাংলা - Bengali</option>
    <option value="Bodo">बड़ो - Bodo</option>
    <option value="Dogri">डोगरी - Dogri</option>
    <option value="Gujarati">ગુજરાતી - Gujarati</option>
    <option value="Hindi">हिन्दी - Hindi</option>
    <option value="Kannada">ಕನ್ನಡ - Kannada</option>
    <option value="Kashmiri">कॉशुर - Kashmiri</option>
    <option value="Konkani">कोंकणी - Konkani</option>
    <option value="Maithili">मैथिली - Maithili</option>
    <option value="Malayalam">മലയാളം - Malayalam</option>
    <option value="Manipuri">মেইতেইলোন্ - Manipuri</option>
    <option value="Marathi">मराठी - Marathi</option>
    <option value="Nepali">नेपाली - Nepali</option>
    <option value="Odia">ଓଡ଼ିଆ - Odia</option>
    <option value="Punjabi">ਪੰਜਾਬੀ - Punjabi</option>
    <option value="Sanskrit">संस्कृतम् - Sanskrit</option>
    <option value="Santali">ᱥᱟᱱᱛᱟᱲᱤ - Santali</option>
    <option value="Sindhi">سنڌي - Sindhi</option>
    <option value="Tamil">தமிழ் - Tamil</option>
    <option value="Telugu">తెలుగు - Telugu</option>
    <option value="Urdu">اردو - Urdu</option>
    <option value="English">English</option>
  </select>

  <button onclick="continueApp()">Continue</button>
  <p id="message"></p>
</div>

<footer>
  RYZON © 2026
</footer>


<script>
function continueApp() {
  const language = document.getElementById("language").value;
  const message = document.getElementById("message");

  if (!language) {
    message.textContent = "Please select a language.";
    return;
  }

  // Save selected language
  localStorage.setItem("ryzonLanguage", language);

  // Continue directly to Home without OTP redirect
  localStorage.setItem("ryzonNextAction", "home");
  window.location.href = "home.html";
}
</script>

</body>
</html>
