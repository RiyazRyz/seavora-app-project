<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEAVORA Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;

    }
    h1 { color: #123b50; }
    .project {
      background: white;
      padding: 16px;

      border-radius: 10px;
      box-shadow: 0 2px 6px #ddd;
    }
    button {

      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    .approve { background: #16834a; color: white; }
    .reject { background: #c93636; color: white; }
    #status { color: #123b50; }
  </style>
</head>
<body>

  <h1>SEAVORA Admin Dashboard</h1>
  <p>Project Approval Panel</p>
 <h3>Admin Login</h3>

<input type="email" id="adminEmail"
placeholder="Admin Email">

<input type="password" id="adminPassword"
placeholder="Admin Password">

<button id="authButton" onclick="toggleAdminAuth()">Login</button>
<button onclick="resetAdminPassword()">Forgot Password?</button>
<p id="resetStatus"></p>
  <p id="loginStatus"></p>
  <p id="status">Loading projects...</p>
  <input type="text" id="projectSearch" placeholder="Search project or seller">
  <div id="projects"></div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, getDocs, doc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    const firebaseConfig = {
apiKey: "AIzaSyCpMeChXryE3KXE7-xUk_iKZGqRaknYcsw",
authDomain: "seavora-5be21.firebaseapp.com",
projectId: "seavora-5be21",
storageBucket: "seavora-5be21.firebasestorage.app",
messagingSenderId: "41187328725",
appId: "1:41187328725:web:07ca55487383bc5798d85c",
measurementId: "G-PDY0RZRDDH"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const ADMIN_UID = "30G6RAmoyJVZsz2rBXEhqdXtVXR2";
    let allProjects = [];
window.toggleAdminAuth = async function () {
  const button = document.getElementById("authButton");
  const loginStatus = document.getElementById("loginStatus");
  if (auth.currentUser && auth.currentUser.uid === ADMIN_UID) {
    await signOut(auth);
    button.textContent = "Login";
    document.getElementById("projects").innerHTML = "";
    document.getElementById("status").textContent = "Please login as admin.";
    loginStatus.textContent = "Logged out.";
    return;
  }

  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);

    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      loginStatus.textContent = "Not authorized as admin.";
      return;
    }

    button.textContent = "Logout";
    loginStatus.textContent = "Admin login successful.";
    await loadProjects();
  } catch (error) {
    loginStatus.textContent = "Login failed: " + error.message;
  }
};

 async function loadProjects() {
  const container = document.getElementById("projects");
  const status = document.getElementById("status");

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    status.textContent = "Please login as admin.";
    return;
  }

  try {
    async function loadProjects() {
  const status = document.getElementById("status");

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    status.textContent = "Please login as admin.";
    return;
  }

  try {
    const snapshot = await getDocs(collection(db, "projects"));
    allProjects = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));

    displayProjects(allProjects);
    status.textContent = allProjects.length + " projects found.";
  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
}
window.resetAdminPassword = async function () {
  const email = document.getElementById("adminEmail").value.trim();
  const status = document.getElementById("resetStatus");

  if (!email) {
    status.textContent = "Enter your admin email first.";
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    status.textContent = "Password reset link sent to your email.";
  } catch (error) {
    status.textContent = "Reset failed: " + error.message;
  }
};
    async function changeStatus(id, newStatus) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin login required.");
    return;
  }

  try {
    await updateDoc(doc(db, "projects", id), { status: newStatus });
    alert("Project status updated!");
    await loadProjects();
  } catch (error) {
    alert("Update failed: " + error.message);
  }
}
  </script>

</body>
</html>
