<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEAVORA Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #123b50; }
    .project {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px #ddd;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    .approve { background: #16834a; color: white; }
    .reject { background: #c93636; color: white; }
    #status { color: #123b50; }
  </style>
</head>
<body>

  <h1>SEAVORA Admin Dashboard</h1>
  <p>Project Approval Panel</p>
 <h3>Admin Login</h3>

<input type="email" id="adminEmail"
placeholder="Admin Email">

<input type="password" id="adminPassword"
placeholder="Admin Password">

loginStatus.textContent = "Admin login successful."; document.getElementById("logoutButton").hidden = false;
<button id="logoutButton" onclick="adminLogout()" hidden>Logout</button>
<p id="loginStatus"></p>
  <p id="status">Loading projects...</p>
  <div id="projects"></div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getFirestore, collection, getDocs, doc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    const firebaseConfig = {
apiKey: "AIzaSyCpMeChXryE3KXE7-xUk_iKZGqRaknYcsw",
authDomain: "seavora-5be21.firebaseapp.com",
projectId: "seavora-5be21",
storageBucket: "seavora-5be21.firebasestorage.app",
messagingSenderId: "41187328725",
appId: "1:41187328725:web:07ca55487383bc5798d85c",
measurementId: "G-PDY0RZRDDH"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const ADMIN_UID = "30G6RAmoyJVZsz2rBXEhqdXtVXR2";

window.adminLogin = async function () {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const loginStatus = document.getElementById("loginStatus");

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);

    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      loginStatus.textContent = "This account is not authorized as admin.";
      return;
    }

    loginStatus.textContent = "Admin login successful.";
    await loadProjects();
  } catch (error) {
    loginStatus.textContent = "Login failed: " + error.message;
  }
};

window.adminLogout = async function () {
  await signOut(auth);
  document.getElementById("projects").innerHTML = "";
  document.getElementById("status").textContent = "Please login as admin.";
  document.getElementById("loginStatus").textContent = "Logged out.";
};

 async function loadProjects() {
  const container = document.getElementById("projects");
  const status = document.getElementById("status");

  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    status.textContent = "Please login as admin.";
    return;
  }

  try {
    const snapshot = await getDocs(collection(db, "projects"));
    container.innerHTML = "";

    snapshot.forEach((item) => {
      const p = item.data();
      const card = document.createElement("div");
      card.className = "project";

      const title = document.createElement("h3");
      title.textContent = p.projectName || "Unnamed Project";

      const seller = document.createElement("p");
      seller.textContent = "Seller: " + (p.sellerName || "");

      const price = document.createElement("p");
      price.textContent = "Price: ₹" + (p.price ?? "");

      const description = document.createElement("p");
      description.textContent = p.description || "";

      const state = document.createElement("p");
      state.textContent = "Status: " + (p.status || "pending");

      card.append(title, seller, price, description, state);

      if (p.status === "pending") {
        const approve = document.createElement("button");
        approve.className = "approve";
        approve.textContent = "Approve";
        approve.onclick = () => changeStatus(item.id, "approved");

        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Reject";
        reject.onclick = () => changeStatus(item.id, "rejected");

        card.append(approve, reject);
      }

      container.appendChild(card);
    });

    status.textContent = snapshot.size + " projects found.";
  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
}
async function changeStatus(id, newStatus) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin login required.");
    return;
  }

  try {
    await updateDoc(doc(db, "projects", id), { status: newStatus });
    alert("Project status updated!");
    await loadProjects();
  } catch (error) {
    alert("Update failed: " + error.message);
  }
}
  </script>

</body>
</html>
