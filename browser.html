
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYZON - Browser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f5f9;
      color: #222;
    }
    header {
      background: #172554;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 12px;
    }
    .card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 7px;
      font-size: 16px;
    }
    input {
      border: 1px solid #bbb;
    }
    button {
      background: #172554;
      color: white;
      border: none;
      cursor: pointer;
    }
    a {
      display: inline-block;
      margin: 8px;
      color: #0759c7;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>RYZON</h1>
  <h2>Built-in Browser</h2>
  <p>Search and explore the web</p>
</header>

<div class="card">
  <h2>Search the Web</h2>
  <input type="text" id="searchBox"
    placeholder="Enter website or search term">
  <button onclick="openWebsite()">Go</button>
</div>

<div class="card">
  <h2>Popular Websites</h2>
  <a href="https://www.google.com/" target="_blank">Google</a>
  <a href="https://www.youtube.com/" target="_blank">YouTube</a>
  <a href="https://www.wikipedia.org/" target="_blank">Wikipedia</a>
  <a href="https://www.google.com/maps" target="_blank">Google Maps</a>
</div>

<footer>
  RYZON © 2026
</footer>

<script>
function openWebsite() {
  const value = document.getElementById("searchBox").value.trim();

  if (!value) {
    alert("Please enter a website or search term.");
    return;
  }

  let url;

  if (/^https?:\/\//i.test(value)) {
    url = value;
  } else if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/i.test(value)) {
    url = "https://" + value;
  } else {
    url = "https://www.google.com/search?q=" +
      encodeURIComponent(value);
  }

  window.open(url, "_blank", "noopener");
}
</script>

</body>
</html>
