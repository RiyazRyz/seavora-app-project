<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAVORA - Project Ideas</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5fb;
  color: #17345c;
}
header {
  background: #123b68;
  color: white;
  padding: 20px;
  text-align: center;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 16px;
  margin: 12px 0;
  border-radius: 12px;
  box-shadow: 0 2px 7px #0001;
}
button {
  background: #2457d6;
  color: white;
  border: 0;
  padding: 12px;
  border-radius: 8px;
  width: 100%;
  font-size: 16px;
}
input {
  width: 100%;
  padding: 13px;
  box-sizing: border-box;
  border: 1px solid #ccd7e5;
  border-radius: 9px;
  font-size: 16px;
}
a { color: #2457d6; }
</style>
</head>
<body>

<header>
<h1>SEAVORA</h1>
<p>School & College Project Ideas</p>
</header>

<main>

<div class="card">
<h2>Find Your Project</h2>
<p>Search project ideas automatically using Google.</p>

<input id="project" placeholder="Enter project name or topic">

<br><br>

<button onclick="searchProject()">
Search Project Ideas
</button>
</div>

<div class="card">
<h3>🏫 School Projects</h3>
<button onclick="searchCategory('School science projects')">
Explore School Projects
</button>
</div>

<div class="card">
<h3>🎓 College Projects</h3>
<button onclick="searchCategory('College engineering projects')">
Explore College Projects
</button>
</div>

<div class="card">
<h3>🔬 Science Exhibition</h3>
<button onclick="searchCategory('Science exhibition working models')">
Explore Science Projects
</button>
</div>

<div class="card">
<h3>🎨 Handmade Projects</h3>
<button onclick="searchCategory('Handmade school and college projects')">
Explore Handmade Ideas
</button>
</div>

<div class="card">
<h3>⚙️ Working Models</h3>
<button onclick="searchCategory('School and college working models')">
Explore Working Models
</button>
</div>

<div class="card">
<h3>🎉 Festival Projects</h3>
<button onclick="searchCategory('School college festival decoration projects')">
Explore Festival Ideas
</button>
</div>

<p><a href="home.html">← Back to Home</a></p>

</main>

<script>
function searchProject() {
  const value = document.getElementById("project").value.trim();

  if (!value) {
    alert("Please enter a project name.");
    return;
  }

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(value + " project ideas"),
    "_blank"
  );
}

function searchCategory(category) {
  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(category),
    "_blank"
  );
}
</script>

</body>
</html>
