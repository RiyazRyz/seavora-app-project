
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYZON - OTP Login</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg, #101c3a, #263f70);
}
.card {
  width: 100%;
  max-width: 420px;
  padding: 28px;
  background: white;
  border-radius: 20px;
  text-align: center;
  color: #17345c;
}
h1 { letter-spacing: 4px; }
input {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #ccd5df;
  border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #2457d6;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
#status { color: #2457d6; }
</style>
</head>
<body>
<div class="card">
  <h1>SEAVORA</h1>
  <h2>Mobile OTP Verification</h2>
  <p>Enter your mobile number to continue.</p>

  <form onsubmit="sendOTP(event)">
    <input id="phone" type="tel"
      inputmode="numeric" maxlength="10"
      placeholder="10-digit mobile number" required>
    <button type="submit">Continue</button>
  </form>

  <div id="otpSection" hidden>
    <input id="otp" type="text"
      inputmode="numeric" maxlength="6"
      placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify OTP</button>
  </div>

  <p id="status"></p>
</div>


<script>
function sendOTP(event) {
  event.preventDefault();

  const phone = document.getElementById("phone").value.trim();

  if (!/^[6-9][0-9]{9}$/.test(phone)) {
    document.getElementById("status").textContent =
      "Enter a valid 10-digit Indian mobile number.";
    return;
  }

  document.getElementById("otpSection").hidden = false;
  document.getElementById("status").textContent =
    "Demo OTP: Use 123456 to test.";
}

function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();

  if (otp === "123456") {
    const action = localStorage.getItem("seavoraNextAction");

    if (action === "randomChat") {
      window.location.href = "random-chat.html";
    } else {
      window.location.href = "home.html";
    }
  } else {
    document.getElementById("status").textContent =
      "Incorrect demo OTP. Please try again.";
  }
}
</script>
</body>
</html>
