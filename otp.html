
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b68">
<title>RYZON - Login</title>

<script src="language-system.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5fb;
  color: #17345c;
  min-height: 100vh;
}

header {
  background: #123b68;
  color: white;
  text-align: center;
  padding: 22px;
}

header h1 {
  margin: 0;
  letter-spacing: 4px;
}

header p {
  color: #dbeafe;
  font-size: 13px;
}

.top {
  display: flex;
  justify-content: flex-end;
  padding: 14px;
}

.top button {
  background: white;
  border: 1px solid #d5dfed;
  border-radius: 10px;
  padding: 10px 13px;
  color: #17345c;
  font-size: 16px;
  cursor: pointer;
}

.container {
  max-width: 420px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px 20px;
  border-radius: 16px;
  box-shadow: 0 3px 12px #00000012;
}

h2 {
  text-align: center;
  margin-top: 0;
}

.description {
  text-align: center;
  color: #718096;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 22px 0;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid #ccd7e5;
  background: #f1f5fb;
  color: #17345c;
  border-radius: 9px;
  cursor: pointer;
}

.tabs button.active {
  background: #123b68;
  color: white;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0 16px;
  border: 1px solid #ccd7e5;
  border-radius: 9px;
  font-size: 16px;
}

.action {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #2457d6;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  text-align: center;
  font-size: 14px;
  margin-top: 15px;
  font-weight: bold;
}

.demo {
  background: #fff8df;
  border: 1px solid #f1df9c;
  padding: 12px;
  border-radius: 9px;
  font-size: 13px;
  margin-top: 16px;
  text-align: center;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  color: #718096;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>RYZON</h1>
  <p>One App, Endless Possibilities!</p>
</header>

<div class="top">
  <button
    data-ryzon-language-toggle
    onclick="toggleRYZONLanguage()">
    🌐 English
  </button>
</div>

<div class="container">
  <div class="card">

    <h2 data-ryzon-text="loginTitle">
      Welcome to RYZON
    </h2>

    <p class="description" data-ryzon-text="loginDescription">
      Login or create your account
    </p>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        data-ryzon-text="login"
        onclick="showLogin()">
        Login
      </button>

      <button
        id="signupTab"
        data-ryzon-text="signUp"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>

    <div id="accountSection">

      <input
        type="tel"
        id="phone"
        maxlength="10"
        inputmode="numeric"
        placeholder="Enter 10-digit mobile number"
        data-ryzon-placeholder="phonePlaceholder">

      <button
        class="action"
        onclick="sendDemoOTP()"
        data-ryzon-text="sendOtp">
        Continue with OTP
      </button>

    </div>

    <div id="otpSection" class="hidden">

      <p class="description" data-ryzon-text="otpDescription">
        Enter the demo OTP to continue
      </p>

      <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter 6-digit OTP"
        data-ryzon-placeholder="otpPlaceholder">

      <button
        class="action"
        onclick="verifyOTP()"
        data-ryzon-text="verifyOtp">
        Verify OTP
      </button>

    </div>

    <p id="message" class="message"></p>

    <div class="demo">
      <span data-ryzon-text="demoOtp">
        Demo OTP: 123456 (SMS is not connected)
      </span>
    </div>

  </div>
</div>

<footer>RYZON © 2026</footer>

<script>
let accountType = "login";
let generatedOTP = "123456";

function currentLanguage() {
  return typeof getRYZONLanguage === "function"
    ? getRYZONLanguage()
    : "en";
}

function showMessage(key, color) {
  const dictionary =
    typeof translations !== "undefined"
      ? translations[currentLanguage()] || {}
      : {};

  const message = document.getElementById("message");

  message.textContent = dictionary[key] || key;
  message.style.color = color;
}

function showLogin() {
  accountType = "login";

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");

  document.getElementById("accountSection").classList.remove("hidden");
  document.getElementById("otpSection").classList.add("hidden");

  document.getElementById("message").textContent = "";
}

function showSignup() {
  accountType = "signup";

  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("accountSection").classList.remove("hidden");
  document.getElementById("otpSection").classList.add("hidden");

  document.getElementById("message").textContent = "";
}

function sendDemoOTP() {
  const phone = document.getElementById("phone").value.trim();

  if (!/^[6-9]\d{9}$/.test(phone)) {
    showMessage("invalidPhone", "red");
    return;
  }

  generatedOTP = "123456";

  document.getElementById("accountSection").classList.add("hidden");
  document.getElementById("otpSection").classList.remove("hidden");

  showMessage("demoReady", "green");
}

function verifyOTP() {
  const enteredOTP = document.getElementById("otp").value.trim();

  if (enteredOTP !== generatedOTP) {
    showMessage("wrongOtp", "red");
    return;
  }

  localStorage.setItem("ryzonVerified", "true");

  localStorage.setItem(
    "ryzonPhone",
    document.getElementById("phone").value.trim()
  );

  showMessage("success", "green");

  setTimeout(function() {
    window.location.href = "home.html";
  }, 700);
}
</script>

</body>
</html>
