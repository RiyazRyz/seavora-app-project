
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101c3a">
  <title>SEAVORA - One App, Endless Possibilities</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #101c3a, #263f70);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .brand {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #cbd8f5;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      color: #172440;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 12px 35px #0004;
    }

    h2 {
      margin-top: 0;
    }

    select {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #ccd3df;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2457d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    .random {
      background: #eaf0ff;
      color: #2348a0;
      margin-top: 18px;
    }

    .note {
      font-size: 12px;
      color: #68758b;
      margin-top: 18px;
    }

    #message {
      margin-top: 16px;
      color: #2457d6;
      font-weight: bold;
    }

    footer {
      color: #cbd8f5;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="brand">SEAVORA</div>
    <div class="tagline">
      One App, Endless Possibilities!
    </div>

    <section class="card">
      <h2>Select Your Language</h2>
      <p>உங்கள் மொழியைத் தேர்வு செய்யுங்கள்</p>

      <select id="language">
        <option value="English">English</option>
        <option value="தமிழ்">தமிழ்</option>
        <option value="हिन्दी">हिन्दी</option>
        <option value="বাংলা">বাংলা</option>
        <option value="తెలుగు">తెలుగు</option>
        <option value="मराठी">मराठी</option>
        <option value="ગુજરાતી">ગુજરાતી</option>
        <option value="ಕನ್ನಡ">ಕನ್ನಡ</option>
        <option value="മലയാളം">മലയാളം</option>
        <option value="ਪੰਜਾਬੀ">ਪੰਜਾਬੀ</option>
        <option value="ଓଡ଼ିଆ">ଓଡ଼ିଆ</option>
        <option value="অসমীয়া">অসমীয়া</option>
        <option value="اردو">اردو</option>
        <option value="संस्कृतम्">संस्कृतम्</option>
        <option value="कोंकणी">कोंकणी</option>
        <option value="मैथिली">मैथिली</option>
        <option value="डोगरी">डोगरी</option>
        <option value="नेपाली">नेपाली</option>
        <option value="سنڌي">سنڌي</option>
        <option value="কাশ্মীরি">کٲشُر</option>
        <option value="मणिपुरी">মৈতৈলোন্</option>
        <option value="बोडो">बड़ो</option>
      </select>

      <button onclick="continueApp()">
        Continue →
      </button>

      <button class="random" onclick="randomChat()">
        💬 Random Chat
      </button>

      <div id="message"></div>

      <div class="note">
        Random Chat requires mobile OTP verification.
        Actual OTP service will be connected during development.
      </div>
    </section>

    <footer>
      © SEAVORA | One App, Endless Possibilities
    </footer>

  </main>

  <script>
    function continueApp() {
      const language =
        document.getElementById("language").value;

      localStorage.setItem("seavoraLanguage", language);

      document.getElementById("message").textContent =
        "Selected language: " + language +
        ". Next: Mobile verification.";
    }

    function randomChat() {
      const language =
        document.getElementById("language").value;

      localStorage.setItem("seavoraLanguage", language);

      document.getElementById("message").textContent =
        "Random Chat requires mobile OTP verification.";
    }
  </script>
</body>
</html>
