
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAVORA - Language Selection</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg, #edf5ff, #f8faff);
  color: #17345c;
  min-height: 100vh;
}
header {
  background: #123b68;
  color: white;
  text-align: center;
  padding: 28px 16px;
}
header h1 {
  margin: 0;
  letter-spacing: 4px;
  font-size: 30px;
}
.tagline {
  margin: 9px 0 0;
  color: #dbeafe;
}
main {
  max-width: 560px;
  margin: auto;
  padding: 24px 18px;
}
.story {
  text-align: center;
  margin-bottom: 24px;
}
.speaker {
  border: 0;
  background: #e0edff;
  color: #123b68;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 22px;
  cursor: pointer;
}
h2 {
  text-align: center;
  color: #123b68;
  margin-bottom: 8px;
}
.sub {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  margin-bottom: 22px;
}
label {
  display: block;
  font-weight: bold;
  margin-bottom: 9px;
}
select {
  width: 100%;
  padding: 15px;
  border: 1px solid #bdcde0;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  color: #17345c;
}
button.continue {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #123b68;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.random {
  margin-top: 24px;
  padding: 18px;
  background: white;
  border: 1px solid #dce6f2;
  border-radius: 14px;
  text-align: center;
}
.random button {
  border: 0;
  background: #e8f1ff;
  color: #123b68;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
#message {
  text-align: center;
  margin-top: 16px;
  color: #17633c;
  font-weight: bold;
}
footer {
  text-align: center;
  padding: 20px;
  color: #718096;
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <h1>SEAVORA</h1>
  <p class="tagline">One App, Endless Possibilities!</p>
</header>

<main>
  <div class="story">
    <button class="speaker" onclick="readStory()" aria-label="Read SEAVORA story">🔊</button>
    <p>Tap to hear about SEAVORA</p>
  </div>

  <h2>Choose Your Language</h2>
  <p class="sub">உங்கள் விருப்பமான மொழியைத் தேர்ந்தெடுக்கவும்</p>

  <label for="language">Select Language / மொழியைத் தேர்ந்தெடுக்கவும்</label>
  <select id="language">
    <option value="en" selected>English</option>
    <option value="as">অসমীয়া - Assamese</option>
    <option value="bn">বাংলা - Bengali</option>
    <option value="brx">बड़ो - Bodo</option>
    <option value="doi">डोगरी - Dogri</option>
    <option value="gu">ગુજરાતી - Gujarati</option>
    <option value="hi">हिन्दी - Hindi</option>
    <option value="kn">ಕನ್ನಡ - Kannada</option>
    <option value="ks">کٲشُر - Kashmiri</option>
    <option value="kok">कोंकणी - Konkani</option>
    <option value="mai">मैथिली - Maithili</option>
    <option value="ml">മലയാളം - Malayalam</option>
    <option value="mni">মৈতৈলোন্ - Manipuri</option>
    <option value="mr">मराठी - Marathi</option>
    <option value="ne">नेपाली - Nepali</option>
    <option value="or">ଓଡ଼ିଆ - Odia</option>
    <option value="pa">ਪੰਜਾਬੀ - Punjabi</option>
    <option value="sa">संस्कृतम् - Sanskrit</option>
    <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ - Santali</option>
    <option value="sd">سنڌي - Sindhi</option>
    <option value="ta">தமிழ் - Tamil</option>
    <option value="te">తెలుగు - Telugu</option>
    <option value="ur">اردو - Urdu</option>
  </select>

  <button class="continue" onclick="continueApp()">
    Continue →
  </button>

  <div class="random">
    <h3>💬 Random Chat</h3>
    <p>Meet and chat with people safely.</p>
    <button onclick="randomChat()">Enter Random Chat</button>
  </div>

  <p id="message" role="status"></p>
</main>

<footer>SEAVORA © 2026</footer>

<script>
function readStory() {
  if (!("speechSynthesis" in window)) {
    alert("Text-to-speech is not supported in this browser.");
    return;
  }
  const story = new SpeechSynthesisUtterance(
    "Welcome to SEAVORA. One App, Endless Possibilities. Explore education, jobs, shopping, local services and more."
  );
  story.lang = "en-IN";
  speechSynthesis.cancel();
  speechSynthesis.speak(story);
}

function continueApp() {
  const language = document.getElementById("language").value;
  localStorage.setItem("seavora_language", language);
  document.getElementById("message").textContent =
    "Language saved! Mobile OTP verification will be required next.";
}

function randomChat() {
  document.getElementById("message").textContent =
    "Mobile OTP verification is required before entering Random Chat.";
}
</script>

</body>
</html>
